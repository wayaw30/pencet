<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PENCETTT</title>

<style>
  /* =========================================================
     1. VARIABEL (warna & ukuran utama). Ubah di sini kalau mau ganti.
     ========================================================= */
  :root {
    --paper: #ffffff;
    --ink:   #0b0b0b;
    --card:  #f1f1f1;
    --card-hover: #e8e8ee;
    --heart: #c23a35;          /* merah hati di halaman bunga */
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --fade: .45s;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
  }

  img { display: block; max-width: 100%; user-select: none; -webkit-user-drag: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #5b7cff; outline-offset: 4px; }

  /* =========================================================
     2. LAYAR (setiap halaman = satu .screen)
        Hanya satu yang punya class "on" pada satu waktu.
     ========================================================= */
  .screen {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
    transform: scale(.985);
    transition: opacity var(--fade) ease, transform var(--fade) ease, visibility 0s linear var(--fade);
    overflow: hidden;
  }
  .screen.on {
    opacity: 1; visibility: visible; transform: none;
    transition: opacity var(--fade) ease, transform var(--fade) ease;
  }

  /* Tombol pil hitam (dipakai di banyak halaman) */
  .pill {
    appearance: none; border: 0; cursor: pointer;
    background: #000; color: #fff;
    width: clamp(180px, 18vw, 256px);
    height: clamp(46px, 4.2vw, 60px);
    border-radius: 999px;
    font-size: clamp(.95rem, 1.35vw, 1.2rem);
    letter-spacing: .01em;
    transition: transform .18s ease, background .18s ease;
  }
  .pill:hover  { transform: scale(1.06); }
  .pill:active { transform: scale(.95); }

  /* =========================================================
     3. LAYAR 1: PRINCESS KECIL + tombol PENCETTT
     ========================================================= */
  #s-home {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(.9rem, 3.4vh, 2rem);
    padding: 3vh 4vw;
  }
  .title {
    margin: 0; font-weight: 400; line-height: 1; text-align: center;
    font-size: min(9vw, 16vh);
    position: relative; z-index: 1;
  }

  /* Kotak gradasi + bentuk 3D yang menimpa judul.
     Satuan "cqw" = persen dari lebar kotak ini, jadi semuanya ikut membesar/mengecil. */
  .bar-wrap {
    position: relative;
    width: min(92vw, 160vh);
    aspect-ratio: 1320 / 390;
    container-type: inline-size;
    clip-path: inset(-30cqw -5cqw 0 -5cqw);   /* potong bagian bawah saja */
    margin-top: -3vh;
  }
  .bar {
    position: absolute; inset: 0;
    border-radius: clamp(14px, 2.2cqw, 30px);
    background: linear-gradient(90deg, #cff6fb 0%, #a9cefd 25%, #86a9ff 48%, #c19eb5 75%, #fd966e 100%);
  }
  .tube {
    position: absolute; z-index: 2;
    left: 50.6%; top: -8.5cqw;
    width: 82.6cqw; height: 82.6cqw;
    transform: translateX(-50%);
    animation: bob 5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
    50%      { transform: translateX(-50%) translateY(-1.2cqw) rotate(.8deg); }
  }

  #s-home .pill { z-index: 3; animation: invite 2.4s ease-in-out infinite; }
  @keyframes invite {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,0,0,.28); }
    60%      { box-shadow: 0 0 0 16px rgba(0,0,0,0); }
  }

  /* =========================================================
     4. LAYAR 2: pilih nomor 1, 2, 3
     ========================================================= */
  #s-pick {
    display: flex; flex-direction: column;
    gap: clamp(1.2rem, 6vh, 3.5rem);
    padding: clamp(1.2rem, 5vh, 3rem) clamp(1rem, 3.5vw, 3rem);
  }
  #s-pick h2 {
    margin: 0; font-weight: 400; line-height: 1;
    font-size: min(6.4vw, 12vh);
  }
  .cards {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(.6rem, 1.6vw, 1.6rem);
    margin-bottom: clamp(0rem, 2vh, 1rem);
  }
  .card {
    appearance: none; border: 0; cursor: pointer;
    background: var(--card);
    border-radius: clamp(14px, 2vw, 28px);
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(.8rem, 4vh, 2rem) 0 clamp(.8rem, 3vh, 2rem);
    min-height: 0; min-width: 0;
    transition: background .25s ease, transform .25s ease;
  }
  .card .no { font-size: clamp(1.1rem, 2.1vw, 1.8rem); flex: none; }
  .card .shape-box { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
  .card img {
    height: 52%; max-height: 52%; width: auto; max-width: 52%;
    object-fit: contain;
    transition: transform .5s cubic-bezier(.3,1.5,.5,1);
    animation: drift 6s ease-in-out infinite;
  }
  .card:nth-child(2) img { animation-delay: -2s; }
  .card:nth-child(3) img { animation-delay: -4s; }
  @keyframes drift {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -1.4vh; }
  }
  .card:hover { background: var(--card-hover); transform: translateY(-6px); }
  .card:hover img { transform: scale(1.14) rotate(8deg); }
  .card:active { transform: translateY(-2px) scale(.98); }

  /* =========================================================
     5. LAYAR NOMOR 1: tangan menunjuk
     ========================================================= */
  .badge {
    position: absolute; left: 1.6vw; top: .4vw;
    width: clamp(64px, 8.1vw, 116px); aspect-ratio: 1;
    border: clamp(2px, .22vw, 3px) solid #222; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700; font-size: clamp(1.8rem, 3.6vw, 3.4rem); line-height: 1;
  }
  #s-one .copy {
    position: absolute; left: 3.5vw; top: 24%;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: clamp(1.4rem, 7vh, 4.4rem);
    padding-left: 1.5vw;
  }
  #s-one .copy p { margin: 0; font-size: clamp(1.05rem, 1.85vw, 1.7rem); }
  #s-one .copy .pill { margin-left: -1.5vw; }
  #s-one .hand {
    position: absolute; left: 62%; top: 31%;
    width: 24%; height: auto;
    animation: poke 1.2s ease-in-out infinite;
  }
  @keyframes poke {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(-9%); }
  }

  /* =========================================================
     6. LAYAR NOMOR 2: anjing
     ========================================================= */
  .bignum {
    position: absolute; left: 1.6vw; top: 1.2vw; z-index: 3;
    font-size: clamp(2.6rem, 6vw, 5.4rem); line-height: 1; font-weight: 400;
  }
  #s-two .dog {
    position: absolute; left: 47%; bottom: -7%;
    height: 106%; width: auto; max-width: none;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    animation: dog-in .7s cubic-bezier(.2,1.2,.4,1) both, dog-tilt 4.5s ease-in-out .7s infinite;
  }
  @keyframes dog-in  { from { transform: translateX(-50%) translateY(14%) scale(.94); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
  @keyframes dog-tilt{ 0%,100% { transform: translateX(-50%) rotate(0deg); } 50% { transform: translateX(-50%) rotate(-2deg); } }
  #s-two:not(.on) .dog { animation: none; }
  #s-two .copy {
    position: absolute; right: 1.6vw; bottom: 3.4%; z-index: 3;
    display: flex; flex-direction: column; align-items: flex-end;
    gap: clamp(.7rem, 3.5vh, 2rem);
  }
  #s-two .copy p {
    margin: 0; font-size: clamp(1rem, 1.55vw, 1.4rem);
    padding: .1em .4em; border-radius: 8px;
    background: rgba(255,255,255,.8);
  }

  /* =========================================================
     7. LAYAR NOMOR 3: bunga dan hati
     ========================================================= */
  #s-three { background: var(--paper); }
  #hearts-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #fall-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  /* hati kecil yang jatuh pelan */
  .fall {
    position: absolute; top: 0; left: var(--x);
    width: var(--s); height: var(--s);
    animation: fall var(--dur) linear var(--delay) both;
    will-change: transform;
  }
  .fall > svg { width: 100%; height: 100%; display: block; fill: var(--c); animation: sway var(--sway) ease-in-out infinite alternate; }
  @keyframes fall {
    from { transform: translate3d(0, -12vh, 0) rotate(var(--r0)); }
    to   { transform: translate3d(var(--dx), 112vh, 0) rotate(var(--r1)); }
  }
  @keyframes sway {
    from { translate: -1.6vw 0; }
    to   { translate:  1.6vw 0; }
  }

  .bouquet {
    position: absolute; left: 50%; bottom: 0; z-index: 2;
    height: min(94%, 130vw);
    aspect-ratio: 752 / 1015;
    transform: translateX(-50%);
    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
  }
  .bouquet .sway {
    width: 100%; height: 100%;
    transform-origin: 50% 92%;
    animation: sway-b 4.4s ease-in-out infinite;
  }
  .bouquet .pop { width: 100%; height: 100%; transform-origin: 50% 85%; }
  .bouquet img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(120,20,30,.18)); }
  @keyframes sway-b {
    0%, 100% { transform: rotate(-2.6deg); }
    50%      { transform: rotate(2.6deg) scale(1.015); }
  }

  /* titik asal ledakan bunga (di area mawar) */
  .fx { position: absolute; left: 42%; top: 28%; width: 0; height: 0; pointer-events: none; }
  .p  { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform, opacity; }
  .petal { width: 1.1rem; height: 1.5rem; border-radius: 85% 0 85% 0; }
  .glow {
    position: absolute; left: -9rem; top: -9rem; width: 18rem; height: 18rem; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,140,155,.65) 0%, rgba(255,140,155,0) 68%);
  }

  .bouquet-btn {
    position: absolute; left: 50%; bottom: 3.2vh; z-index: 4;
    transform: translateX(-50%);
    width: auto; padding: 0 2.2em; white-space: nowrap;
    animation: invite 2.4s ease-in-out infinite;
  }
  .bouquet-btn:hover  { transform: translateX(-50%) scale(1.06); }
  .bouquet-btn:active { transform: translateX(-50%) scale(.95); }

  /* =========================================================
     8. TAMPILAN HP (layar sempit)
     ========================================================= */
  @media (max-width: 760px) {
    .title { font-size: 10vw; }
    #s-pick h2 { font-size: 9.5vw; }
    .cards { gap: .5rem; flex: none; height: min(56vh, 420px); }
    .card img { height: 46%; max-height: 46%; max-width: 70%; }

    .badge { left: 1rem; top: 1rem; width: 4.2rem; font-size: 2rem; }
    #s-one .copy { left: 1.2rem; right: 1.2rem; top: 8.2rem; padding-left: 0; gap: 1.6rem; }
    #s-one .copy .pill { margin-left: 0; }
    #s-one .hand { left: 50%; top: auto; bottom: 8%; width: 62%; margin-left: -31%; }

    .bignum { left: 1rem; top: .8rem; font-size: 3.6rem; }
    #s-two .dog { height: auto; width: 118vw; left: 50%; bottom: -3%; }
    #s-two .copy { left: 1rem; right: 1rem; top: 5.6rem; bottom: auto; align-items: flex-start; }
    #s-two .copy p { background: none; padding: 0; }
    .pill { width: 200px; }
  }

  /* orang yang memilih "kurangi gerakan" di perangkatnya */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>

  <button class="pill bouquet-btn" id="bouquetBtn" type="button">PENCET BUNGANYA!</button>
</section>


<script>
  /* =========================================================
     A. PINDAH HALAMAN
     Setiap tombol punya data-go. Saat diklik, kita ubah "hash"
     di alamat (#pick, #one, ...). Perubahan hash membuat halaman
     berganti, dan tombol BACK di browser/HP juga ikut bekerja.
     ========================================================= */
  const screens = {};
  document.querySelectorAll(".screen").forEach(function (el) {
    screens[el.dataset.name] = el;
  });

  function show(name) {
    if (!screens[name]) name = "home";
    Object.keys(screens).forEach(function (key) {
      const aktif = key === name;
      screens[key].classList.toggle("on", aktif);
      screens[key].inert = !aktif;                 // layar tersembunyi tidak bisa difokus
      screens[key].setAttribute("aria-hidden", aktif ? "false" : "true");
    });
    if (name === "three") startHearts(); else stopHearts();

    // kalau pengguna memakai keyboard, fokuskan tombol pertama (tanpa garis biru untuk mouse/sentuh)
    if (pakaiKeyboard) {
      const tombol = screens[name].querySelector("button");
      if (tombol) setTimeout(function () { try { tombol.focus({ preventScroll: true }); } catch (e) {} }, 60);
    }
  }
  let pakaiKeyboard = false;
  document.addEventListener("keydown", function () { pakaiKeyboard = true; });
  document.addEventListener("pointerdown", function () { pakaiKeyboard = false; });

  function dariHash() {
    return location.hash.replace("#", "") || "home";
  }

  document.addEventListener("click", function (e) {
    const t = e.target.closest("[data-go]");
    if (t) location.hash = t.dataset.go;
  });
  window.addEventListener("hashchange", function () { show(dariHash()); });


  /* =========================================================
     B. LAYAR 3: hati-hati coretan di latar (dibuat sekali)
     ========================================================= */
  function acak(seed) {                 // pengacak kecil supaya hasilnya selalu sama
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  (function buatCoretan() {
    const rnd = acak(11);
    const NS = "http://www.w3.org/2000/svg";
    const g = document.getElementById("scribbles");
    for (let i = 0; i < 74; i++) {
      const size = 34 + rnd() * 100;
      const x = rnd() * 1600, y = rnd() * 900;
      const miring = (rnd() - .5) * 90;
      const lebar = .75 + rnd() * .5, tinggi = .9 + rnd() * .9;
      const u = document.createElementNS(NS, "use");
      u.setAttribute("href", "#heart-line");
      u.setAttribute("width", size); u.setAttribute("height", size);
      u.setAttribute("transform",
        "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + miring.toFixed(1) + ") scale(" + lebar.toFixed(2) + " " + tinggi.toFixed(2) + ") translate(" + (-size / 2) + " " + (-size / 2) + ")");
      u.setAttribute("opacity", (.75 + rnd() * .25).toFixed(2));
      g.appendChild(u);
    }
  })();


  /* =========================================================
     C. LAYAR 3: hati kecil berjatuhan
     ========================================================= */
  const gerakKurang = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const warnaHati = ["#e0525a", "#f28b95", "#c23a35", "#f7a9b0", "#d9434d"];
  const layer = document.getElementById("fall-layer");
  let timerHati = null;

  function jatuhkanHati(awalSudahJalan) {
    const h = document.createElement("span");
    const ukuran = 14 + Math.random() * 24;
    const dur = 7 + Math.random() * 6;
    h.className = "fall";
    h.style.setProperty("--x", (Math.random() * 100).toFixed(1) + "%");
    h.style.setProperty("--s", ukuran.toFixed(0) + "px");
    h.style.setProperty("--dur", dur.toFixed(1) + "s");
    h.style.setProperty("--delay", awalSudahJalan ? "-" + (Math.random() * dur).toFixed(1) + "s" : "0s");
    h.style.setProperty("--sway", (1.6 + Math.random() * 2).toFixed(1) + "s");
    h.style.setProperty("--dx", ((Math.random() - .5) * 18).toFixed(1) + "vw");
    h.style.setProperty("--r0", ((Math.random() - .5) * 60).toFixed(0) + "deg");
    h.style.setProperty("--r1", ((Math.random() - .5) * 360).toFixed(0) + "deg");
    h.style.setProperty("--c", warnaHati[Math.floor(Math.random() * warnaHati.length)]);
    h.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#heart-fill"/></svg>';
    h.addEventListener("animationend", function (ev) { if (ev.target === h) h.remove(); });
    layer.appendChild(h);
  }

  function startHearts() {
    if (gerakKurang || timerHati) return;
    layer.innerHTML = "";
    for (let i = 0; i < 16; i++) jatuhkanHati(true);       // isi awal supaya tidak kosong
    timerHati = setInterval(function () {
      if (layer.childElementCount < 34) jatuhkanHati(false);
    }, 520);
  }
  function stopHearts() {
    clearInterval(timerHati); timerHati = null;
    layer.innerHTML = "";
  }


  /* =========================================================
     D. LAYAR 3: klik bunga. Klik ganjil = MEKAR, klik genap = BERGUGURAN
     ========================================================= */
  const bouquet = document.getElementById("bouquet");
  const pop = bouquet.querySelector(".pop");
  const fx = document.getElementById("fx");
  const warnaKelopak = ["#e8606a", "#d94a56", "#f08a92", "#c93a47", "#f6b3b9"];
  let klik = 0;

  function ambilWarna() { return warnaKelopak[Math.floor(Math.random() * warnaKelopak.length)]; }
  function banyakPartikel() { return fx.childElementCount > 220; }

  function mekar() {
    // 1) buket memantul
    pop.animate([
      { transform: "scale(1)" },
      { transform: "scale(.93)", offset: .18 },
      { transform: "scale(1.15)", offset: .45 },
      { transform: "scale(.98)", offset: .7 },
      { transform: "scale(1.04)", offset: .85 },
      { transform: "scale(1)" }
    ], { duration: 800, easing: "ease-out" });

    if (gerakKurang || banyakPartikel()) return;

    // 2) cahaya merah muda yang melebar
    const glow = document.createElement("span");
    glow.className = "p glow"; fx.appendChild(glow);
    glow.animate([
      { transform: "scale(.2)", opacity: .9 },
      { transform: "scale(2.6)", opacity: 0 }
    ], { duration: 900, easing: "ease-out" }).onfinish = function () { glow.remove(); };

    // 3) kelopak dan hati melesat keluar dari mawar
    for (let i = 0; i < 30; i++) {
      const sudut = (Math.PI * 2 * i) / 30 + Math.random() * .3;
      const jarak = 110 + Math.random() * 230;
      const el = document.createElement("span");
      if (i % 3 === 0) {
        el.className = "p";
        el.style.width = el.style.height = (14 + Math.random() * 14) + "px";
        el.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="' + ambilWarna() + '"><use href="#heart-fill"/></svg>';
      } else {
        el.className = "p petal";
        el.style.background = ambilWarna();
      }
      fx.appendChild(el);
      const dx = Math.cos(sudut) * jarak, dy = Math.sin(sudut) * jarak;
      el.animate([
        { transform: "translate(-50%,-50%) scale(.2) rotate(0deg)", opacity: 1 },
        { transform: "translate(" + dx + "px," + dy + "px) scale(1) rotate(" + (Math.random() * 360) + "deg)", opacity: 1, offset: .6 },
        { transform: "translate(" + dx * 1.15 + "px," + (dy + 50) + "px) scale(.8) rotate(" + (Math.random() * 540) + "deg)", opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: "cubic-bezier(.15,.8,.3,1)" }).onfinish = function () { el.remove(); };
    }
  }

  function berguguran() {
    // buket bergetar sebentar
    pop.animate([
      { transform: "rotate(0deg)" },
      { transform: "rotate(-3deg)", offset: .2 },
      { transform: "rotate(3deg)", offset: .45 },
      { transform: "rotate(-1.5deg)", offset: .7 },
      { transform: "rotate(0deg)" }
    ], { duration: 650, easing: "ease-in-out" });

    if (gerakKurang || banyakPartikel()) return;

    const asal = fx.getBoundingClientRect();
    const jarakJatuh = window.innerHeight - asal.top + 60;
    for (let i = 0; i < 48; i++) {
      const el = document.createElement("span");
      el.className = "p petal";
      el.style.background = ambilWarna();
      const s = .7 + Math.random() * .9;
      el.style.width = (1.1 * s) + "rem"; el.style.height = (1.5 * s) + "rem";
      fx.appendChild(el);

      const x0 = (Math.random() - .5) * 150, y0 = (Math.random() - .5) * 80;
      const drift = (Math.random() - .5) * 360;
      const dur = 2400 + Math.random() * 2200;
      el.animate([
        { transform: "translate(" + x0 + "px," + y0 + "px) rotate(0deg)", opacity: 0 },
        { transform: "translate(" + (x0 + drift * .25) + "px," + (y0 + 30) + "px) rotate(80deg)", opacity: 1, offset: .08 },
        { transform: "translate(" + (x0 + drift * .6) + "px," + (jarakJatuh * .5) + "px) rotate(" + (200 + Math.random() * 200) + "deg)", opacity: 1, offset: .55 },
        { transform: "translate(" + (x0 + drift) + "px," + jarakJatuh + "px) rotate(" + (420 + Math.random() * 360) + "deg)", opacity: .9 }
      ], { duration: dur, delay: Math.random() * 800, easing: "cubic-bezier(.45,.05,.8,.95)", fill: "backwards" }).onfinish = function () { el.remove(); };
    }
  }

  function pencetBunga() {
    klik++;
    if (klik % 2 === 1) mekar(); else berguguran();
  }
  bouquet.addEventListener("click", pencetBunga);
  document.getElementById("bouquetBtn").addEventListener("click", pencetBunga);


  /* =========================================================
     E. MULAI
     ========================================================= */
  show(dariHash());
</script>
</body>
</html>
